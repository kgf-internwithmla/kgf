<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Tracking · KGF Portal</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="attendance.css"></head>
<body><div id="nav"></div><main><h1>Attendance Tracking</h1><p class="sub">Attendance records of the fellows.</p>
<form class="card adm" id="fa"><label>Date<input id="ad" name="att_date" type="date" required></label>
<div class="wide"><div class="pkh"><label class="pk"><input type="checkbox" id="sa"><b>Select all fellows</b></label><span class="muted" id="cnt">0 selected</span></div><div id="pick" class="pickgrid"></div></div>
<div class="wide mkb"><span>Mark selected fellows as</span><button class="mk P" value="Present">Present</button><button class="mk A" value="Absent">Absent</button><button class="mk L" value="Leave">Leave</button></div></form>
<h2>Attendance overview</h2><div id="list"></div>
<h2>Date-wise attendance record</h2>
<div class="ctl"><label class="adm">Fellow<select id="vf"></select></label><label>Month<input type="month" id="vm"></label><label>Select date<input type="date" id="vd"></label><button class="sec sm" id="all" type="button">Show all dates</button></div>
<div id="dayv"></div><div id="sum" class="chips"></div><div id="cal"></div><div id="days"></div>
</main><script src="shared.js"></script><script src="attendance.js"></script></body></html>
