<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasks &amp; Assignments · KGF Portal</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="tasks.css"></head>
<body><div id="nav"></div><main><h1>Tasks &amp; Assignments</h1><p class="sub">Report Submission, Fieldwork, inspections and civic follow-ups.</p>
<form class="card adm" id="f"><b id="mode" style="grid-column:1/-1" hidden></b><label>Task<input name="title" required></label><label>Location<input name="location"></label><label>Assign to<select name="assigned_to" id="who"></select></label><label>Due date<input name="due_date" type="date" required></label><label>Priority<select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></label><button id="go">Assign task</button><button type="button" id="all" class="all">Assign to Everyone</button><button type="button" class="sec" id="cancel" hidden>Cancel</button></form>
<div id="list"></div></main><script src="shared.js"></script><script src="tasks.js"></script></body></html>
