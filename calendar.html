<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar &amp; Schedule · KGF Portal</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="calendar.css"></head>
<body><div id="nav"></div><main><h1>Calendar &amp; Schedule</h1><p class="sub">Field visits, meetings and programme events.</p>
<form class="card adm" id="f"><b id="mode" style="grid-column:1/-1" hidden></b><label>Event<input name="title" required></label><label>Type<select name="type"><option>Field visit</option><option>Meeting</option><option>Training</option><option>Programme</option></select></label><label>Date<input name="event_date" type="date" required></label><label>Time<input name="event_time" type="time"></label><label>Place<input name="location"></label><button id="go">Add event</button><button type="button" class="sec" id="cancel" hidden>Cancel</button></form><div class="cal-bar"><button class="sec sm" id="prev">Previous</button><strong id="mon"></strong><button class="sec sm" id="next">Next</button></div><div id="grid"></div><h2>This month</h2><div id="list"></div>
</main><script src="shared.js"></script><script src="calendar.js"></script></body></html>
